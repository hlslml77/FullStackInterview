name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      chrome:
        image: chromedp/headless-shell:latest
        ports:
          - 9222:9222
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
